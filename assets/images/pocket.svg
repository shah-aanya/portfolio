<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" fill="none">
  <!-- Drop shadow -->
  <path fill="#2C2C2C" fill-opacity="0.10"
    d="M33,3 L3,3 Q0,3 0,6 L0,254 Q0,263 9,263 L411,263 Q420,263 420,254 L420,6 Q420,3 417,3 L387,3 L387,213 Q387,221 379,221 L41,221 Q33,221 33,213 Z"
    transform="translate(3,3)"/>

  <!-- Pocket body (U-shape: 30px walls, open top) -->
  <path fill="#6B7C45"
    d="M30,0 L0,0 L0,250 Q0,260 10,260 L410,260 Q420,260 420,250 L420,0 L390,0 L390,210 Q390,218 382,218 L38,218 Q30,218 30,210 Z"/>

  <!-- Slightly darker inner crease where walls meet interior -->
  <line x1="30" y1="210" x2="390" y2="210" stroke="#3A4820" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Left wall highlight -->
  <rect x="0" y="0" width="30" height="260" fill="white" fill-opacity="0.07" rx="0"/>

  <!-- Right wall highlight -->
  <rect x="390" y="0" width="30" height="260" fill="white" fill-opacity="0.07" rx="0"/>

  <!-- Stitching — left wall -->
  <line x1="15" y1="18" x2="15" y2="244"
    stroke="#3A4820" stroke-opacity="0.65" stroke-width="1.5"
    stroke-dasharray="7 5" stroke-linecap="round"/>

  <!-- Stitching — right wall -->
  <line x1="405" y1="18" x2="405" y2="244"
    stroke="#3A4820" stroke-opacity="0.65" stroke-width="1.5"
    stroke-dasharray="7 5" stroke-linecap="round"/>

  <!-- Stitching — bottom -->
  <line x1="15" y1="248" x2="405" y2="248"
    stroke="#3A4820" stroke-opacity="0.65" stroke-width="1.5"
    stroke-dasharray="7 5" stroke-linecap="round"/>

  <!-- Corner grommets -->
  <circle cx="15" cy="248" r="5.5" fill="#3A4820" fill-opacity="0.75"/>
  <circle cx="405" cy="248" r="5.5" fill="#3A4820" fill-opacity="0.75"/>
</svg>
